<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/vazir-font@latest/dist/font-face.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #0d1b3e 100%);
            min-height: 100vh;
            font-family: 'Vazir', sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; margin-bottom: 20px; font-size: 22px; }
        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: rgba(138,43,226,0.6);
            background: rgba(138,43,226,0.05);
        }
        .upload-zone p { color: rgba(255,255,255,0.6); font-size: 14px; }
        .glass-btn {
            background: rgba(138,43,226,0.3);
            border: 1px solid rgba(138,43,226,0.5);
            border-radius: 12px;
            padding: 12px 24px;
            color: #fff;
            cursor: pointer;
            font-family: 'Vazir', sans-serif;
            width: 100%;
            margin-top: 15px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .glass-btn:hover { background: rgba(138,43,226,0.5); }
        .glass-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            font-size: 13px;
            line-height: 1.8;
        }
        #result.ok { background: rgba(0,255,127,0.1); border: 1px solid rgba(0,255,127,0.3); display: block; }
        #result.err { background: rgba(255,0,0,0.1); border: 1px solid rgba(255,0,0,0.3); display: block; }
        .progress { width:100%; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; margin-top:15px; display:none; }
        .progress .fill { height:100%; background:linear-gradient(90deg,#8a2be2,#00d4ff); border-radius:2px; width:0%; transition:width .3s; }
    </style>
</head>
<body>
    <div class="glass-card">
        <h2>🔓 NPvt Cracker</h2>

        <div class="upload-zone" id="dropZone">
            <p>📁 فایل .npvt رو اینجا بنداز یا کلیک کن</p>
            <input type="file" id="fileInput" accept=".npvt,.nvpt" hidden>
        </div>

        <div class="progress" id="progress"><div class="fill" id="progressFill"></div></div>
        <div id="result"></div>
        <button class="glass-btn" onclick="tg.close()">بستن</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const result = document.getElementById('result');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) selectFile(fileInput.files[0]); });

        function selectFile(file) {
            selectedFile = file;
            dropZone.querySelector('p').textContent = '📎 ' + file.name;
            uploadFile();
        }

        async function uploadFile() {
            if (!selectedFile) return;
            const fd = new FormData();
            fd.append('file', selectedFile);
            fd.append('user_id', tg.initDataUnsafe?.user?.id || '0');

            progress.style.display = 'block';
            progressFill.style.width = '0%';
            result.className = '';
            result.style.display = 'none';

            try {
                const xhr = new XMLHttpRequest();
                xhr.upload.onprogress = e => {
                    if (e.lengthComputable) progressFill.style.width = Math.round(e.loaded/e.total*100) + '%';
                };
                const res = await new Promise((ok, fail) => {
                    xhr.onload = () => ok(JSON.parse(xhr.responseText));
                    xhr.onerror = () => fail(new Error('خطا'));
                    xhr.open('POST', '/api/upload');
                    xhr.send(fd);
                });

                if (res.success) {
                    result.className = 'ok';
                    result.innerHTML = '✅ ' + res.message + '<br>' + (res.protocols || '');
                } else {
                    result.className = 'err';
                    result.innerHTML = '❌ ' + res.message;
                }
            } catch(e) {
                result.className = 'err';
                result.innerHTML = '❌ ' + e.message;
            }
            progress.style.display = 'none';
        }
    </script>
</body>
</html>
