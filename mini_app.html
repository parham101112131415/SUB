<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/vazir-font@latest/dist/font-face.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #0d1b3e 100%);
            min-height: 100vh;
            font-family: 'Vazir', sans-serif;
            color: #fff;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            max-width: 450px;
            margin: 0 auto;
        }
        h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: rgba(138,43,226,0.6);
            background: rgba(138,43,226,0.05);
        }
        .upload-zone p { color: rgba(255,255,255,0.6); font-size: 14px; }
        #result { margin-top: 15px; display: none; }
        .link-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            word-break: break-all;
        }
        .link-item:active { background: rgba(138,43,226,0.3); }
        .link-item .type { color: rgba(138,43,226,0.9); font-weight: bold; font-size: 11px; }
        .link-item .url { color: rgba(255,255,255,0.7); margin-top: 4px; }
        .status { text-align: center; padding: 10px; border-radius: 10px; margin-top: 10px; display: none; }
        .status.ok { display: block; background: rgba(0,255,127,0.1); border: 1px solid rgba(0,255,127,0.3); }
        .status.err { display: block; background: rgba(255,0,0,0.1); border: 1px solid rgba(255,0,0,0.3); }
        .glass-btn {
            background: rgba(138,43,226,0.3);
            border: 1px solid rgba(138,43,226,0.5);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            cursor: pointer;
            font-family: 'Vazir', sans-serif;
            width: 100%;
            margin-top: 12px;
            font-size: 14px;
        }
        .glass-btn:hover { background: rgba(138,43,226,0.5); }
        .copied { color: #0f0; font-size: 11px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="glass-card">
        <h2>🔓 NPvt Cracker</h2>

        <div class="upload-zone" id="dropZone">
            <p>📁 فایل .npvt رو اینجا بنداز یا کلیک کن</p>
            <input type="file" id="fileInput" accept=".npvt,.nvpt,.json" hidden>
        </div>

        <div class="status" id="status"></div>
        <div class="copied" id="copied">کپی شد!</div>
        <div id="result"></div>
        <button class="glass-btn" onclick="tg.close()">بستن</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const result = document.getElementById('result');
        const status = document.getElementById('status');
        const copied = document.getElementById('copied');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

        function handleFile(file) {
            dropZone.querySelector('p').textContent = '📎 ' + file.name;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    let text = e.target.result;
                    // اگه فایل JSON باشه
                    if (text.trim().startsWith('[') || text.trim().startsWith('{')) {
                        const data = JSON.parse(text);
                        showConfigs(Array.isArray(data) ? data : [data], file.name);
                    } else {
                        // اگه رمزگشایی لازم باشه
                        status.className = 'status err';
                        status.textContent = '⚠️ این فایل نیاز به رمزگشایی داره. از ربات استفاده کن.';
                        status.style.display = 'block';
                    }
                } catch (err) {
                    status.className = 'status err';
                    status.textContent = '❌ فایل معتبر نیست: ' + err.message;
                    status.style.display = 'block';
                }
            };
            reader.readAsText(file);
        }

        function showConfigs(configs, filename) {
            let links = [];
            configs.forEach((cfg, i) => {
                const profile = cfg.v2rayProfile || cfg;
                const name = cfg.name || cfg.remarks || 'config_' + (i+1);
                // استخراج لینک vless/vmess
                if (profile.v2rayJson) {
                    try {
                        const v2 = typeof profile.v2rayJson === 'string' ? JSON.parse(profile.v2rayJson) : profile.v2rayJson;
                        const addr = v2.address || v2.add || '';
                        const port = v2.port || 443;
                        const id = v2.id || '';
                        const net = v2.network || 'tcp';
                        const sni = v2.security === 'tls' ? (v2.sni || addr) : '';
                        const path = v2.path || '';
                        const host = v2.host || '';

                        if (v2.protocol === 'vless' || v2.protocol === 'vmess') {
                            const proto = v2.protocol;
                            let url;
                            if (proto === 'vless') {
                                url = `vless://${id}@${addr}:${port}?encryption=none&security=tls&sni=${sni}&type=${net}&host=${host}&path=${path}#${name}`;
                            } else {
                                const vmessObj = {v:"2",ps:name,add:addr,port:port,id:id,aid:0,net:net,type:"host",host:host,path:path,tls:"tls"};
                                url = 'vmess://' + btoa(JSON.stringify(vmessObj));
                            }
                            links.push({name, proto: proto.toUpperCase(), url});
                        }
                    } catch(e) {}
                }
                // اگه خودش لینک باشه
                if (typeof cfg === 'string' && (cfg.startsWith('vless://') || cfg.startsWith('vmess://'))) {
                    links.push({name: 'link_' + (i+1), proto: cfg.startsWith('vless') ? 'VLESS' : 'VMESS', url: cfg});
                }
            });

            if (links.length === 0) {
                status.className = 'status err';
                status.textContent = '⚠️ پروتکلی پیدا نشد.';
                status.style.display = 'block';
                return;
            }

            status.className = 'status ok';
            status.textContent = `✅ ${links.length} کانفیگ پیدا شد`;
            status.style.display = 'block';

            result.style.display = 'block';
            result.innerHTML = links.map((l, i) =>
                `<div class="link-item" onclick="copyLink(${i})">
                    <div class="type">${l.proto}</div>
                    <div class="url">${l.name}</div>
                </div>`
            ).join('');

            // ذخیره لینک‌ها برای کپی
            window._links = links;
        }

        function copyLink(idx) {
            const url = window._links[idx].url;
            navigator.clipboard.writeText(url).then(() => {
                copied.style.display = 'block';
                setTimeout(() => copied.style.display = 'none', 1500);
            }).catch(() => {
                // fallback
                const ta = document.createElement('textarea');
                ta.value = url;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                copied.style.display = 'block';
                setTimeout(() => copied.style.display = 'none', 1500);
            });
        }
    </script>
</body>
</html>
